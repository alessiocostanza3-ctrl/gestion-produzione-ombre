name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-check-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint (0 errors)
        run: npx eslint .

      - name: Check (automated regression tests)
        run: node _check.js

      - name: Build (esbuild bundle)
        run: node build.mjs
