<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — PROD</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
        body {
            display: flex; align-items: center; justify-content: center;
            background: #111827; color: #e2e8f0; text-align: center; padding: 24px;
        }
        .card {
            background: #1e293b; border-radius: 20px; padding: 40px 32px;
            max-width: 360px; width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
        }
        .icon { font-size: 52px; margin-bottom: 20px; }
        h1 { font-size: 1.3rem; font-weight: 700; margin-bottom: 10px; color: #f1f5f9; }
        p  { font-size: 0.93rem; color: #94a3b8; line-height: 1.6; margin-bottom: 24px; }
        button {
            background: #f1f5f9; color: #111827; border: none; border-radius: 12px;
            padding: 12px 28px; font-size: 0.95rem; font-weight: 600; cursor: pointer;
            transition: background .2s;
        }
        button:hover { background: #ffffff; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📡</div>
        <h1>Nessuna connessione</h1>
        <p>Non è possibile caricare i dati.<br>Controlla la tua connessione e riprova.</p>
        <button onclick="window.location.reload()">↻ Riprova</button>
    </div>
</body>
</html>
